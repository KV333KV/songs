name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        env:
          FEEDBACK_TOKEN: ${{ secrets.FEEDBACK_TOKEN }}
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }} 2>&1 | tee build.txt
      - name: Report compiler errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.txt | head -40 | while IFS= read -r line; do echo "::error::$line"; done
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Songsmith.apk
      - uses: actions/upload-artifact@v4
        with:
          name: songsmith-apk
          path: Songsmith.apk
      - name: Publish as the latest release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" Songsmith.apk --title "Songsmith 1.${{ github.run_number }}" --notes "${{ github.event.head_commit.message }}" --latest
