name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }}
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk Songsmith.apk
      - uses: actions/upload-artifact@v4
        with:
          name: songsmith-apk
          path: Songsmith.apk
      - name: Publish as the latest release (direct phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" Songsmith.apk --title "Songsmith 1.${{ github.run_number }}" --notes "${{ github.event.head_commit.message }}" --latest
